name: Verify Pages build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate static portal
        run: python3 build_opc_html.py
      - name: Require generated page to be committed
        run: git diff --exit-code -- index.html
