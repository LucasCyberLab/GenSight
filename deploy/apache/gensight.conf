<VirtualHost *:80>
    ServerName gensight.clodhost.com
    Redirect permanent / https://gensight.clodhost.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName gensight.clodhost.com
    ServerAdmin admin@clodhost.com

    SSLEngine on
    SSLCertificateFile /etc/ssl/hermes/selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/hermes/selfsigned.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass / http://127.0.0.1:8025/
    ProxyPassReverse / http://127.0.0.1:8025/

    ProxyTimeout 60

    ErrorLog /var/log/apache2/gensight-error.log
    CustomLog /var/log/apache2/gensight-access.log combined
</VirtualHost>
