<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GenSight 跨境视觉外包内部作战台">
  <title>GenSight · 今日作战台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --ink: #17212b; --muted: #62707f; --line: #d8e0e8; --paper: #f5f7f8;
      --surface: #ffffff; --navy: #102a43; --blue: #1565c0; --mint: #1f8a70;
      --orange: #c65d07; --soft-blue: #e9f2fc; --soft-mint: #e7f5f0;
      --shadow: 0 10px 30px rgba(16,42,67,.08); --radius: 16px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Noto Sans SC", system-ui, sans-serif; line-height: 1.65; }
    button { font: inherit; }
    .shell { max-width: 1280px; margin: auto; padding: 0 24px 64px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 22px 0; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: -.02em; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--navy); color: white; }
    .status { color: var(--mint); font: 500 12px "DM Mono", monospace; letter-spacing: .04em; }
    .eyebrow { margin: 0 0 10px; color: var(--blue); font: 500 12px "DM Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .section-label { margin: 8px 0 14px; color: var(--muted); font: 500 12px "DM Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); align-items: start; gap: 28px; margin-top: 8px; }
    nav { position: sticky; top: 18px; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); max-height: calc(100vh - 36px); overflow: auto; }
    .nav-group { padding: 10px 6px 3px; color: var(--muted); font: 500 11px "DM Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .nav-item { display: block; width: 100%; padding: 10px; border: 0; border-radius: 9px; color: var(--ink); background: transparent; cursor: pointer; text-align: left; }
    .nav-item:hover, .nav-item.active { background: var(--soft-blue); color: var(--blue); }
    .nav-item small { display: block; color: var(--muted); font-size: 11px; }
    .view { min-height: 520px; }
    #docView { display: none; padding: clamp(22px, 4vw, 46px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    #calcView { display: none; }
    .doc-meta { margin-bottom: 24px; color: var(--muted); font-size: 13px; }
    .doc-body h1 { font-size: 30px; } .doc-body h2 { margin-top: 38px; font-size: 21px; } .doc-body h3 { margin-top: 26px; font-size: 17px; }
    .doc-body p, .doc-body li { color: #374858; } .doc-body img { max-width: 100%; height: auto; border-radius: 12px; }
    .doc-body table { width: 100%; border-collapse: collapse; margin: 22px 0; font-size: 14px; }
    .doc-body th, .doc-body td { padding: 12px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    .doc-body th { background: #eef3f7; }
    .doc-body blockquote { margin: 20px 0; padding: 12px 18px; border-left: 4px solid var(--blue); background: var(--soft-blue); }
    .doc-body code { padding: 2px 5px; border-radius: 4px; background: #eef3f7; }
    footer { margin-top: 48px; color: var(--muted); font-size: 12px; text-align: center; }
    @media (max-width: 780px) {
      .shell { padding: 0 16px 42px; }
      .layout { grid-template-columns: 1fr; }
      nav { position: static; max-height: none; }
      header .status { display: none; }
    }
    /* Calculator scoped tokens */
    #calcView {
      --text-muted: var(--muted);
      --text-main: var(--ink);
      --accent-blue: var(--blue);
      --accent-gold: var(--orange);
      --accent-green: var(--mint);
      --bg-card: var(--surface);
      --bg-main: var(--paper);
      --border-color: var(--line);
      --shadow-card: 0 8px 24px rgba(16, 42, 67, 0.06);
    }

    /* War room */
    .warroom { padding: 32px 0 28px; }
    .warroom-head { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(240px, 0.6fr); gap: 24px; margin-bottom: 28px; }
    .warroom h1 { margin: 0 0 10px; font-size: clamp(26px, 4vw, 44px); line-height: 1.15; letter-spacing: -.04em; }
    .warroom-lead { color: var(--muted); font-size: 16px; max-width: 680px; margin: 0; }
    .goal-card { padding: 20px; border: 1px solid #c6d8eb; border-radius: var(--radius); background: var(--soft-blue); }
    .goal-card strong { display: block; margin-bottom: 8px; font-size: 13px; color: var(--blue); letter-spacing: .04em; text-transform: uppercase; }
    .goal-card p { margin: 0 0 10px; color: #31516f; font-size: 14px; }
    .goal-meta { font: 500 12px "DM Mono", monospace; color: var(--muted); }
    .metrics-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
    .metric-card { padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .metric-card .label { font: 500 11px "DM Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .metric-card h3 { margin: 8px 0 4px; font-size: 17px; }
    .metric-card p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
    .metric-card a, .metric-card button.linkish { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: none; color: var(--blue); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; }
    .metric-card a:hover, .metric-card button.linkish:hover { text-decoration: underline; }
    .metric-card.status-warn { border-left: 4px solid var(--orange); }
    .metric-card.status-bad { border-left: 4px solid #c0392b; }
    .metric-card.status-good { border-left: 4px solid var(--mint); }
    .panels-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; }
    .panel { padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .panel h3 { margin: 0 0 8px; font-size: 16px; }
    .panel p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
    .panel ol { margin: 0; padding-left: 20px; color: #374858; font-size: 14px; }
    .panel li { margin-bottom: 6px; }
    .feishu-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 22px; border-radius: var(--radius); background: var(--navy); color: #fff; margin-bottom: 8px; }
    .feishu-bar h2 { margin: 0 0 4px; font-size: 16px; }
    .feishu-bar p { margin: 0; color: #b8d0e7; font-size: 13px; }
    .feishu-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .feishu-btn { display: inline-flex; align-items: center; padding: 9px 14px; border-radius: 8px; border: 1px solid #52718e; background: rgba(255,255,255,.06); color: #fff; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .feishu-btn.primary { background: var(--blue); border-color: var(--blue); }
    .feishu-btn.disabled { opacity: .65; cursor: not-allowed; pointer-events: none; }
    .feishu-note { font: 500 11px "DM Mono", monospace; color: #8fb4d4; margin-top: 8px; }
    .copy-template-btn { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }
    .copy-template-btn:hover { border-color: var(--blue); color: var(--blue); }
    .nav-home { border-bottom: 1px solid var(--line); margin-bottom: 6px; padding-bottom: 8px; }
    .nav-home .nav-item { font-weight: 700; }

    /* Calculator */
    .calculator-container { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
    .calc-box, .summary-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
    .summary-card { border: 2px solid var(--blue); position: sticky; top: 18px; }
    .calc-title { font-size: 18px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .currency-switcher { display: flex; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
    .curr-btn { flex: 1; padding: 9px; border: none; border-radius: 7px; background: transparent; color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; }
    .curr-btn.active { background: var(--blue); color: #fff; }
    .option-group { margin-bottom: 22px; }
    .group-label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 10px; }
    .item-card { border: 1.5px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; cursor: pointer; background: var(--surface); transition: border-color .15s; }
    .item-card:hover, .item-card.selected { border-color: var(--blue); }
    .item-card.selected { background: var(--soft-blue); }
    .item-header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .item-name { font-size: 15px; font-weight: 700; }
    .item-desc { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .item-price { font-size: 16px; font-weight: 800; color: var(--orange); white-space: nowrap; }
    .deliverables-box { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--paper); font-size: 12px; }
    .deliverable-title { font-weight: 700; color: var(--blue); margin-bottom: 4px; }
    .deliverable-list { list-style: none; padding: 0; margin: 0; }
    .deliverable-list li { margin-bottom: 3px; }
    .qty-control { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .qty-btn { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); font-weight: 700; cursor: pointer; }
    .qty-num { font-size: 14px; font-weight: 700; width: 24px; text-align: center; }
    .bill-header { font-size: 17px; font-weight: 800; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; display: flex; justify-content: space-between; }
    .bill-item-block { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
    .bill-item-title-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
    .bill-item-specs { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
    .bill-total-box { margin-top: 16px; padding-top: 14px; border-top: 2px dashed var(--line); }
    .bill-total-label { font-size: 12px; color: var(--muted); font-weight: 700; }
    .bill-total-amount { font-size: 28px; font-weight: 900; color: var(--blue); margin-top: 4px; }
    .discount-badge { background: var(--soft-mint); color: var(--mint); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px; margin-top: 8px; display: inline-block; }
    .action-btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
    .btn-action { background: var(--paper); border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-action:hover { border-color: var(--blue); }
    .btn-primary { background: linear-gradient(135deg, #1565c0, #0284c7); border: none; color: #fff; font-weight: 700; }
    .btn-primary:hover { opacity: .95; }

    @media (max-width: 900px) {
      .warroom-head, .metrics-row, .panels-row, .calculator-container { grid-template-columns: 1fr; }
      .summary-card { position: static; }
    }

  </style>
</head>

    const docs = {"00-current-operating-baseline.md": "# GenSight 当前运营基线\n\n> 生效日期：2026-08-04  \n> 用途：这是当前业务和日常执行的唯一判断入口。若其他历史文档与本文冲突，以本文为准，直到下一次明确更新。\n\n## 1. 当前唯一主线\n\nGenSight 当前以 **跨境电商与独立站视觉素材代制作** 为主线：\n\n- 平台：Amazon、美客多、Shopee、TikTok、SHEIN、Shopify。\n- 客户：已有产品与销售基础、视觉素材影响点击或转化的跨境卖家、工贸一体企业和 DTC 品牌。\n- 核心产品：体验包、单 SKU Listing 开款包、跨平台素材月包；需要时提供 A+、多语种和 TikTok 微动效增配。\n- 当前目的：用可展示的 Demo、定向触达和小额体验包，验证“视觉素材代制作 → 月包续费”的成交路径。\n\n## 2. 不作为当前主线的事项\n\n- 国内 Logo / VI、PPT、效果图、品牌全案：可以承接自然到来的零星订单，但不作为本周主动获客、内容发布或案例展示的主要方向。\n- 独立站全案：保留为高客单机会与 Demo 展示方向，在跨境视觉素材月包获得稳定验证前，不作为日常交付重心。\n- 本机 `archive/app.js` 工作台：不再作为日常协同工具。\n\n这不是否定历史积累，而是避免两人把有限精力同时投入多条获客线。\n\n## 3. 每日运行规则\n\n### 数据与协作\n\n- **飞书多维表格是唯一数据源**：任务、负责人、交接、线索、报价、成交、交付状态和晚间复盘必须记录在飞书。\n- GitHub Pages 只提供 SOP、报价、案例和战略上下文，不保存业务状态。\n- 晨会只确认每人 1–3 个可验收输出；发生战略选择时，放到固定复盘时段，不在执行时讨论。\n\n### 优先级\n\n1. 已预付客户的交付与风险处理。\n2. 跨境目标客户的有效触达和询盘跟进。\n3. 跨境视觉案例、Prompt 和交付模板的资产沉淀。\n4. 国内设计机会单，只在不挤占前三项时承接。\n\n## 4. 两人职责\n\n| 角色 | 主责 | 可验收输出 |\n| --- | --- | --- |\n| Howard | 目标客户筛选、触达、需求诊断、报价、英文/多语种卖点文案、客户沟通与复盘 | 有效触达记录、报价/需求确认、可执行 Brief、复盘结论 |\n| Brian | 平台视觉拆解、AI 素材生成与精修、平台尺寸适配、案例成稿与交付物整理 | 可审阅视觉稿、符合平台规格的导出包、可复用 Prompt/模板 |\n\n## 5. 每周唯一目标的写法\n\n每周只写一个结果，而不是一串待办。例如：\n\n> 完成 1 个跨境视觉 Demo 的案例包装，并向 25 个目标商家发出带诊断的定向触达，获得至少 3 个有效回复。\n\n对应飞书需要有：负责人、截止日、验收标准、关联资料、下一步动作和状态。\n\n## 6. 文档状态\n\n| 文档层 | 当前状态 | 用法 |\n| --- | --- | --- |\n| `opc-doc/` 跨境视觉外包资料 | 当前 | 作为产品、案例、策略和执行 SOP 的资料库 |\n| `00–18` 国内设计规划 | 历史 / 机会型现金流参考 | 仅在承接国内机会单时查阅，不进入跨境日计划 |\n| 飞书多维表格方案 | 当前协作系统 | 承载任务、线索、成交、交接和复盘的权威状态 |\n| `app.js` + `server.py` 本机工作台 | 退役 | 不再维护为并行数据源 |\n", "feishu-daily-workflow.md": "# 飞书日常协同工作流\n\n> 版本：2026-08-04  \n> 状态：**当前协作系统**  \n> 原则：飞书多维表格是唯一权威数据源；GitHub Pages 只提供 SOP 与资料导航。\n\n---\n\n## 1. 一天走一遍（Howard + Brian）\n\n| 时段 | 动作 | 飞书表 | 本站按需打开 |\n| --- | --- | --- | --- |\n| 09:00 晨会 | 各确认 1–3 项可验收输出；标记阻塞 | T04 每日任务、T01 任务交接 | [当前运营基线](./00-current-operating-baseline.md) |\n| 09:30–17:30 执行 | 触达、交付、交接 | T01、T05 询盘、T08 案例 | [产品与报价](./product-spec-and-pricing.md)、[交付 SOP](./learning-and-sop-roadmap.md) |\n| 17:30 数据归档 | 记录进账、触达、交付进度 | T06 晚间复盘 | [每日执行 SOP](./daily-action-and-review-guide.md) |\n| 21:00 复盘 | 四问复盘 → 次日 Top 3 | T06 | [获客到复购 SOP](./07-conversion-loop.md) |\n\n完整表结构见仓库根目录 [`16-feishu-bitable-workbench-plan.md`](../16-feishu-bitable-workbench-plan.md)。CSV 模板在 [`feishu-import/`](../feishu-import/)。\n\n---\n\n## 2. 任务字段标准（可执行闭环）\n\n每项任务、交接或待办**必须**包含以下字段，缺一不得进入「进行中」：\n\n| 字段 | 说明 | 示例 |\n| --- | --- | --- |\n| **负责人** | 当前执行人 | Brian |\n| **截止日** | 可验收日期 | 2026-08-05 |\n| **预期输出** | 交付物名称 + 数量/规格 | 3 套 Amazon 主图对比卡，1080×1080 PNG |\n| **下一位接手者** | 完成后谁确认/接手 | Howard 客户确认 |\n| **完成标准** | 怎样算 Done | 客户可在飞书预览并通过，或 Howard 标记「可外发」 |\n| **关联资料** | 文档库或本站链接 | `product-spec-and-pricing.md` §体验包 |\n| **状态** | 待办 / 进行中 / 待确认 / 被阻塞 / 已完成 | 待确认 |\n\n### 默认视图规则\n\n- **当前待办**：状态 = 待办 或 进行中，负责人 = 我\n- **待我确认**：下一位接手者 = 我，状态 = 待确认\n- **被阻塞**：状态 = 被阻塞（晨会必须读出阻塞原因与解除条件）\n- **历史**：通过日期或状态筛选，不进入首页\n\n---\n\n## 3. 表与业务动作映射\n\n| 编号 | 表名 | 写入时机 | 关键字段 |\n| --- | --- | --- | --- |\n| T01 | 任务交接 | Howard ↔ Brian 派单/返工 | 任务标题、类型、发起人、接手人、关联文档、制作说明、截止日期 |\n| T04 | 每日任务 | 晨会确认当日 Top 3 | 日期、执行人、任务、当日交付物、状态 |\n| T05 | 询盘记录 | 每次有效对话后 15 分钟内 | 来源、平台、产品意向、报价、跟进人、状态 |\n| T06 | 晚间复盘 | 21:00 四问 | 日期、进账、触达数、有效回复、瓶颈、Stop/Keep/Start、次日 Top3 |\n| T08 | 案例库 | 结案脱敏后 | 平台、案例类型、包装进度、可外发链接 |\n| T10 | 产品与报价 | 报价变更时 | 套餐名、RMB/USD 价、交付数量、边界说明 |\n\n---\n\n## 4. 线索与订单推进\n\n```\n触达/回复 → T05 新建询盘 → 需求诊断 + 报价（T10 / 本站计算器）→ 50% 订金\n    → T01 派单给 Brian → 交付 → T08 案例沉淀 → T06 复盘成交路径\n```\n\n询盘状态建议：`新询盘` → `需求确认` → `已报价` → `已付订金` → `交付中` → `已结案` → `流失`。\n\n---\n\n## 5. 与 GitHub Pages 的边界\n\n| 放在飞书 | 放在 GitHub Pages |\n| --- | --- |\n| 任务状态、负责人、截止日 | 任务字段定义与本 SOP |\n| 线索跟进、成交金额 | 报价标准、案例、平台规范 |\n| 晚间复盘、次日 Top 3 | 复盘四问模板、晨会议程 |\n| 案例包装进度 | Demo 展示与 Prompt 参考 |\n\n**禁止**：在浏览器 localStorage、本机 `app.js` 或 Pages 表单中维护「权威」任务/线索状态。\n\n---\n\n## 6. 配置入口\n\n1. 在飞书创建多维表格并导入 `feishu-import/*.csv`。\n2. 将 base 链接写入 `portal/site-config.json` → `feishu.baseUrl` 及各表 `path`。\n3. 运行 `python3 build_opc_html.py` 重新生成首页飞书跳转按钮。\n", "storage-and-pages-boundary.md": "# GenSight 数据存储与系统边界\n\n> 版本：2026-08-04  \n> 读者：Howard、Brian — 避免 GitHub Pages、本机工具与飞书三套状态分叉\n\n---\n\n## 1. 三系统职责（唯一权威）\n\n| 系统 | 职责 | 是否权威状态 |\n| --- | --- | --- |\n| **飞书多维表格** | 任务、交接、线索、报价成交、交付进度、晚间复盘 | **是** |\n| **GitHub Pages（本站）** | 今日作战台入口、SOP、报价标准、案例、战略上下文、报价计算器 | **否**（只读） |\n| **GitHub 仓库 Markdown** | 内容源文件、版本历史、构建输入 | **否**（源文件，非运行时状态） |\n\n---\n\n## 2. 已退役系统\n\n| 组件 | 原用途 | 现状 |\n| --- | --- | --- |\n| `archive/app.js` + `archive/server.py` | 本机 `/api/data` 双人协同 | **已归档**，不参与日常流程 |\n| 浏览器 `localStorage` 日记录 | 每日复盘持久化 | **已移除**；复盘仅写飞书 T06 |\n| 首页「自动同步 / 双人共享」文案 | 误导性承诺 | **已改为**飞书入口与配置说明 |\n\n如需查看旧工作台实现，见 [`archive/README.md`](../archive/README.md)。\n\n---\n\n## 3. 飞书表与 CSV 导入\n\n| 编号 | 表 | CSV |\n| --- | --- | --- |\n| T01 | 任务交接 | `feishu-import/01-任务交接表.csv` |\n| T04 | 每日任务 | `feishu-import/04-每日任务表.csv` |\n| T05 | 询盘记录 | `feishu-import/05-询盘记录.csv` |\n| T06 | 晚间复盘 | `feishu-import/06-晚间复盘.csv` |\n| T08 | 案例库 | `feishu-import/08-案例库.csv` |\n| T10 | 产品与报价 | `feishu-import/10-产品与报价表.csv` |\n\n规划全文：[`16-feishu-bitable-workbench-plan.md`](../16-feishu-bitable-workbench-plan.md)  \n日常用法：[`feishu-daily-workflow.md`](./feishu-daily-workflow.md)\n\n---\n\n## 4. 配置 GitHub Pages 上的飞书入口\n\n1. 在飞书创建多维表格 base，导入上述 CSV。  \n2. 编辑 `portal/site-config.json`：  \n   - `feishu.baseUrl`：表格 base 链接  \n   - `feishu.tables.*.path`：各子表路径（可选，留空则只跳 base）  \n3. 运行 `python3 build_opc_html.py`，提交 `index.html`。  \n4. 首页「打开飞书」与各指标卡将指向已配置链接。\n\n**未配置时**：首页显示配置说明，不假装已连接。\n\n---\n\n## 5. 发布流程\n\n```bash\n# 1. 改 Markdown 或 portal/site-config.json\n# 2. 重新生成静态站\npython3 build_opc_html.py\n# 3. 提交 index.html 与源文件\ngit add index.html build_opc_html.py opc-doc/ portal/\ngit commit -m \"docs: update operations portal\"\ngit push\n```\n\nGitHub Pages 从仓库 **root `index.html`** 发布。  \nVite 品牌展示页在 **`deck/index.html`**，与 Pages 入口分离。\n\n---\n\n## 6. 禁止事项\n\n- 不要在 Pages 上新增「保存任务/线索」表单并声称双人同步  \n- 不要恢复 `localStorage` 作为复盘权威存储  \n- 不要并行维护第四套 Notion/Excel 状态表（除非明确迁移并废弃飞书）\n", "daily-action-and-review-guide.md": "# GenSight · OPC 每日行动指南、执行记录与晚间复盘 SOP\n\n> 版本：2026-08-04 跨境视觉外包 · 飞书权威版  \n> 适用角色：**Howard (商业策略/客户对接) & Brian (视觉设计/AI出图)**  \n> 核心原则：**日清日毕、数据说话、行为写进飞书、跨境主线优先**  \n> 数据权威：**飞书 T04/T01/T05/T06** — 详见 [飞书日常协同工作流](./feishu-daily-workflow.md)\n\n---\n\n## 零、晨会 10 分钟（飞书 T04 + T01）\n\n1. 打开 GitHub Pages **今日作战台**，确认本周唯一目标。  \n2. 在飞书 **T04** 各确认 1–3 项任务，字段含：负责人、截止日、预期输出、接手者、完成标准。  \n3. 扫 **T01** 待接手 / 被阻塞项，阻塞必须在晨会读出。  \n4. 国内设计机会单：**仅**在不挤占已预付跨境交付时插入 T04。\n\n---\n\n## 一、 每日时间线行动指南 (Daily Action Schedule)\n\n| 时间段 | 核心行动指标 (KPI Focus) | 责任人 | 具体行动步骤与交付标准 |\n|---|---|---|---|\n| **09:00 - 09:30** | **晨会站会与日任务对齐** | Howard & Brian | • 确认今日现金流基石订单与出海视觉订单排期<br>• 明确今日必须联系的 5 家潜在商家名单 |\n| **09:30 - 12:00** | **刺刀见红：跨境主动触达** | Howard | • 筛选 5 家 Amazon/美客多/Shopee 视觉弱但销量尚可的商家<br>• 协调 Brian 出 1 张免费 CTR 对比卡<br>• 通过 LinkedIn / 平台站内信 / 微信国际客户触达<br>• **15 分钟内**将有效回复写入飞书 **T05** |\n| **09:30 - 12:00** | **AI 素材研发与模版库沉淀** | Brian | • 针对 5 大平台（Amazon/美客多/Shopee/TikTok/SHEIN）迭代最新 Prompt<br>• 精修准备发给商家的高清对比主图卡 |\n| **14:00 - 17:30** | **订单极速交付与客户跟进** | Brian & Howard | • 交付现金流基石订单（海报/PPT/效果图）与月包素材<br>• 跟进意向商家沟通，引导体验包 (¥880/次) 转化 |\n| **17:30 - 18:00** | **数据归档与次日准备** | Howard | • 将获客数、成交金额、交付进度写入飞书 **T06** 草稿字段<br>• 在 **T01** 安排 Brian 次日出图排期 |\n| **21:00 - 21:30** | **OPC 晚间四问复盘** | Howard & Brian | • 完整填写 **T06 晚间复盘**<br>• Stop/Keep/Start → 次日 Top 3 写回 **T04** |\n\n---\n\n## 二、 OPC 晚间四问复盘模板 (Evening Review SOP)\n\n1. **今日亮点与战果 (What Went Well?)**：\n   - 今日进账现金流是多少？（如：实收微信转账 ¥1,680 / ¥6,800）\n   - 今日成功触达了多少商家？产生了多少有效回复？\n2. **今日瓶颈与阻碍 (Bottleneck Analysis)**：\n   - 在沟通或交付中遇到了什么卡点？（如：客户觉得周期长、AI 跑图风格不符合等）\n3. **发现的新假设与机会 (Hypothesis & Insights)**：\n   - 是否发现了新的高需求类目或平台（如美客多拉美西语商家特别多）？\n4. **闭环行动调整 (Stop / Keep / Start)**：\n   - **Stop (停止做)**：停止做任何拖慢交付、不上量无收益的低效琐事。\n   - **Keep (继续做)**：继续保持每天免费给 1 家意向客户做对比图的极速获客。\n   - **Start (开始做)**：明天在 LinkedIn / 目标平台增发 1 篇跨境视觉案例拆解触达。\n\n> 复盘内容**只存飞书 T06**，不在 GitHub Pages 或浏览器本地保存。\n\n---\n\n## 三、 次日工作规划 Top 3 原则 (Next-Day Top 3 Priorities)\n\n1. **优先级 1 (最高)**：完成已预付客户的订单交付，确保 24 小时内满意交货。\n2. **优先级 2 (获客)**：完成 5 家潜在外贸商家的免费对比图触达，撬开至少 1 家深度沟通。\n3. **优先级 3 (沉淀)**：沉淀 1 套新的 AI 场景 Prompt 模板至 GenSight 资产库。\n", "product-spec-and-pricing.md": "# 元晟传媒 (Gensight) - 5大跨境平台与独立站视觉交付手册及精细化报价表单\n\n> 版本：2026-08 结构化表单精细定稿版  \n> 适用平台：**美客多 (Mercado Libre) / 亚马逊 (Amazon) / Shopee / TikTok (Shop & Ads) / SHEIN / Shopify 独立站**  \n> 核心原则：**100% 结构化表单展示、交付数量与标准清晰对齐、国内外双轨报价透明**  \n\n---\n\n## 表一：GenSight 视觉外包套餐、交付数量与国内外双轨报价对照表\n\n| 套餐名称 | 适合客户群 | 具体交付数量与规格 | 包含服务内容 | 国内商家价 (RMB) | 海外客户价 (USD) |\n|---|---|---|---|---|---|\n| **[体验款]<br>3套高CTR素材体验包** | 试水客户、意向测试商家 | **3 套** 高 CTR 广告 KV<br>• 每套含 1:1 + 9:16 双尺寸<br>• **共 6 张精修图** | • 素材痛点诊断<br>• 英文/西语 Headline 撰写<br>• 签约月包可全额抵扣 | **¥880 / 次** | **$150 / 次** |\n| **[单项包]<br>单平台 Listing 全套开款包** | 新品上架、爆款 Listing 打造<br>(Amazon/美客多/Shopee/SHEIN) | **1 款 SKU 全套 Listing 视觉**<br>• **1 张** 纯白底合规主图<br>• **6 张** 卖点/对比/尺寸附图<br>• **1 套** 响应式 Banner / A+ | • 多语种卖点文案<br>• 欧美 Lifestyle 模特生成<br>• 1:1 / 3:4 标准尺寸 | **¥1,680 / 套** | **$280 / 套** |\n| **[主力月包]<br>多平台跨平台素材代制作包** | 多平台大卖家<br>(Amazon+TikTok / Shopify+美客多) | **每月 24 件/套 核心素材**<br>• **12 套** 广告 KV (**共36张** 1:1/9:16/16:9 延伸图)<br>• **4 套** Listing 升级包 (**折合24+张**)<br>• **8 组** TikTok 动态/静态卡片 | • Howard+Brian 全包<br>• 西/英/葡多语种支持<br>• 全店视觉合规诊断<br>• 免费 2 次细节调整 | **¥6,800 / 月**<br>*(季签 ¥18,800)* | **$1,350 / 月**<br>*(季签 $3,600)* |\n\n---\n\n## 表二：5大跨境平台与独立站视觉交付规范细目表\n\n| 目标平台 | 适用核心场景 | 平台规范尺寸 | 交付物构成与标准 | 语言与文化规范 |\n|---|---|---|---|---|\n| **亚马逊 (Amazon)** | Listing 主/附图、A+ 页面、品牌旗舰店 | • 主/附图: 2000x2000px (1:1)<br>• A+ 模块: 970x600px / 970x300px<br>• 旗舰店: 3000x600px | • 100% 纯白底合规主图<br>• 功能爆破图/痛点对比图/尺寸图<br>• A+ 基础排版模块 | 欧美主流英语 (美英/英英) |\n| **美客多 (Mercado Libre)** | 拉美 Listing、店面 Header、活动 Banner | • Listing 图: 1200x1200px (1:1)<br>• 旗舰店: 1600x400px | • 拉美风高明度色系场景<br>• 西班牙语 / 葡萄牙语多语种文案<br>• 品牌 Header 视觉包 | 西班牙语 (MX/CL/CO)<br>葡萄牙语 (BR) |\n| **Shopee** | 东南亚 Listing、Flash Sale 促销图、店铺 Feed | • Listing 图: 1024x1024px (1:1)<br>• 促销 Banner: 1200x600px (2:1) | • 高饱和度促销氛围<br>• 营销挂框 (Promo Frame)<br>• 移动端高可读性小图优化 | 英语 / 东南亚小语种 |\n| **TikTok (Shop & Ads)** | TikTok 广告 Feed、Carousel 轮播图、视频封面 | • 竖屏 Feed: 1080x1920px (9:16)<br>• 轮播卡: 1080x1080px (1:1) | • 高点击率 (High-CTR) 原生风卡片<br>• 9:16 沉浸式 Hook 痛点封面<br>• 静态+微动效素材 | 简短高爆点英文 Hook |\n| **SHEIN** | 服饰/生活方式 Listing、Lookbook 杂志大图 | • 产品/生活图: 1344x1792px (3:4)<br>• 促销 Banner: 1:1 / 16:9 | • 欧美时尚杂志感 Lookbook<br>• 高端光影场景与 Lifestyle 模特<br>• 潮流色系搭配 | 欧美时尚英语 |\n| **Shopify 独立站** | 首页 Hero Banner、Collection 图、Pop-up 弹窗 | • Hero Banner: 1920x1080px (16:9)<br>• 弹窗 Banner: 1000x1000px (1:1) | • 欧美 DTC 极简风格 (Minimalist)<br>• 响应式 Web / Mobile 视图<br>• 引导点击 CTA 按钮包装 | 品牌标准英语 |\n\n---\n\n## 表三：服务边界、包与非包规则对照表\n\n| 服务类别 | 明确包含在报价内 (Included) | 明确不包含 / 需额外计费 (Excluded) |\n|---|---|---|\n| **视觉与素材制作** | • 产品 3D 渲染感背景生成<br>• 欧美 Lifestyle 模特 AI 生成<br>• 1:1, 9:16, 16:9 三尺寸免费延伸导出 | • 复杂工业/硬件产品的底层 3D CAD 建模<br>(需客户提供产品白底图/3D源文件) |\n| **文案与策略** | • 英语/西班牙语/葡萄牙语营销 Headline 撰写<br>• 痛点切入策略与 CTA 按钮包装 | • 超过 50 页的长篇英文说明书翻译<br>• 专利/法律条款排版 |\n| **改稿与交付规则** | • 交付后 2 次免费细节微调 (如文字/颜色)<br>• 源文件 (.PSD/.PNG/PDF) 归客户所有 | • 颠覆原定 Brief 策略的全局重做 (按 30% 加收)<br>• 几百款 SKU 纯重复贴图 (超量 ¥100/张) |\n| **账号与代运营** | • 全店视觉与文案合规避坑诊断 | • 代客户充值广告费或代操作广告投放账户 |\n", "visual-portfolio-showcase.md": "# GenSight · 5大跨境平台与独立站视觉作品及 Demo 样板案例库\n\n> 版本：2026-08 案例展示定稿版  \n> 视觉理念：**以大厂级商业审美撬动点击转化 — 策略先于视觉，品质胜于低价**  \n\n---\n\n## 1. 亚马逊 (Amazon) & 美客多 (Mercado Libre) Listing 视觉模版\n\n### 案例 A：智能无线耳机 3D 爆破卖点图 (Amazon 1:1 纯白底合规图)\n- **目标平台**：Amazon / 美客多 (Mercado Libre)\n- **规范尺寸**：`1:1 (2000x2000px)`\n- **物料品类**：Listing 爆破卖点图 / 降噪技术分解图\n- **设计标准**：100% 纯白底符合合规、矢量英文标注、ANC 40dB 降噪核心芯片分解展示、欧美极简商业排版。\n\n![Amazon Earbuds Listing Infographic](portfolio_amazon_earbuds.png)\n\n---\n\n## 2. TikTok Ads & Carousel 沉浸式高 CTR 广告卡片\n\n### 案例 B：便携户外太阳能储能电源 (TikTok 9:16 沉浸式广告卡)\n- **目标平台**：TikTok (TikTok Shop & TikTok Ads) / Instagram Reels\n- **规范尺寸**：`9:16 (1080x1920px)` 竖屏沉浸式卡片\n- **物料品类**：High-CTR 原生广告卡片 / Hook 痛点封面\n- **设计标准**：2000W 快充露营星空场景、挂盘突出痛点标语、内置引导点击 CTA \"Shop Now\" 按钮。\n\n![TikTok Powerstation 9:16 Ad Creative](portfolio_tiktok_powerstation.png)\n\n---\n\n## 3. SHEIN 服饰与生活方式杂志感 Lookbook 模版\n\n### 案例 C：城市通勤极简双肩包 Lookbook (SHEIN 3:4 时尚大图)\n- **目标平台**：SHEIN / Instagram Shop / Pinterest\n- **规范尺寸**：`3:4 (1344x1792px)` 竖屏 Lookbook\n- **物料品类**：时尚杂志 Lookbook 场景大图 / 新品 Trend 海报\n- **设计标准**：欧美真实 Lifestyle 模特、街头电影感大厂光影、Vogue 风格高端留白与优雅排版。\n\n![SHEIN Fashion Backpack Lookbook](portfolio_shein_backpack.png)\n\n---\n\n## 4. Shopify DTC 独立站 16:9 大厂 Hero Banner\n\n### 案例 D：意式智能咖啡机品牌 Hero Banner (Shopify 16:9)\n- **目标平台**：Shopify / WooCommerce / 自建独立站\n- **规范尺寸**：`16:9 (1920x1080px)` 宽屏 Hero Banner\n- **物料品类**：独立站首页大图 / Premium Collection 轮播 Header\n- **设计标准**：暗调大理石奢华厨房场景、暖金质感光影、衬线字体高贵文案 \"THE ART OF PERFECT ESPRESSO\"、全响应式移动端/Web端自适应。\n\n![Shopify Espresso Machine Hero Banner](portfolio_shopify_hero.png)\n\n---\n\n## 5. 跨平台视觉规范与交付流转矩阵\n\n| 平台名称 | 标准尺寸 | 交付物构成与规格 | 关键转化指标 (KPI Focus) |\n|---|---|---|---|\n| **亚马逊 (Amazon)** | `1:1 (2000×2000px)` | 1 张白底主图 + 6 张卖点附图 + 1 套 A+ 模块 | **防踩坑合规率 + 页面转化率 (CVR)** |\n| **美客多 (Mercado Libre)** | `1:1 (1200×1200px)` | 1 张白底主图 + 拉美多语种 Header 视觉包 | **西班牙语 / 葡萄牙语买家本土信任度** |\n| **TikTok Ads** | `9:16 (1080×1920px)` | 沉浸式 9:16 Hook 封面 + 轮播卡片 | **广告点击率 (CTR) + 前3秒留存率** |\n| **SHEIN** | `3:4 (1344×1792px)` | 3:4 时尚 Lookbook 场景杂志大图 | **品牌美誉度 + 潮流调性点击** |\n| **Shopify 独立站** | `16:9 (1920×1080px)` | 16:9 首页 Hero Banner + Collection 排版 | **高客单价溢价 + 页面停留时长** |\n", "07-conversion-loop.md": "# 元晟传媒 (Gensight) - OPC 07 转化闭环\n\n> 状态：当前 · **跨境视觉外包主线**  \n> 路径：**触达 → 承接 → 成交 → 交付 → 复购/沉淀**  \n> 权威记录：飞书 **T05 询盘**、**T01 交接**、**T08 案例**\n\n---\n\n## 1. 转化全路径结构\n\n```\n[ 流量触达 ] (LinkedIn / 平台站内信 / 定向邮件 / 案例图文)\n     │\n     ▼\n[ 需求承接 ] (Howard 15 分钟内响应 → 体验包 / Listing 包报价)\n     │          本站：产品与报价 + 智能报价计算器\n     ▼\n[ 成交签约 ] (确认 SKU/月包范围 → 预付 50% 订金 → 写入 T05/T10)\n     │\n     ▼\n[ 飞书协同交付 ] (T01 派单：Howard Brief + Brian 出图 → 待确认 → 交付)\n     │          SOP：learning-and-sop-roadmap.md\n     ▼\n[ 尾款与案例沉淀 ] (T08 脱敏案例 → 下一轮触达素材)\n```\n\n国内渠道（小红书/闲鱼）**不作为当前主动触达主线**；若自然询盘，按 [archive-domestic-plans.md](./archive-domestic-plans.md) 机会型处理。\n\n---\n\n## 2. 关键节点 SOP 规范\n\n| 节点 | 对应资料 | 核心动作与责任人 |\n| --- | --- | --- |\n| **1. 询盘接待** | [08-sales-and-intake-sop.md](../08-sales-and-intake-sop.md)（通用原则） | Howard 15 分钟内响应；T05 建档；发案例与报价 |\n| **2. 需求拆解与报价** | [product-spec-and-pricing.md](./product-spec-and-pricing.md) + 本站计算器 | 对齐体验包/Listing/月包；无争议后 50% 订金 |\n| **3. 制作与协同交付** | [learning-and-sop-roadmap.md](./learning-and-sop-roadmap.md) | T01 交接；Brian 出图；Howard 策略审查 |\n| **4. 案例复用与沉淀** | [visual-portfolio-showcase.md](./visual-portfolio-showcase.md) + T08 | 结案脱敏；作为下一轮 LinkedIn/触达素材 |\n\n---\n\n## 3. 阶段性结论\n\n建盘期 OPC 01–07 已落盘。日常运营以 [00-current-operating-baseline.md](./00-current-operating-baseline.md) 与飞书协同为准。\n\n- 重复劳动系统化 → [08-asset-ops.md](./08-asset-ops.md)  \n- 周瓶颈与 Stop-loss → [09-dashboard-review.md](./09-dashboard-review.md)\n", "learning-and-sop-roadmap.md": "# 元晟传媒 (Gensight) - 独立站技术学习计划与两人协同 SOP\n\n> 版本：2026-08 实施版  \n> 目标：7 天内攻克 No-Code 独立站搭建全流程，建立标准化交付 SOP。  \n\n---\n\n## 1. 7 天速成学习计划 (No-Code 建站 + AI 视觉 + 英文 Copywriting)\n\n### Day 1 ~ Day 2：No-Code 建站核心技术拆解 (Howard + Brian)\n- **重点**：放弃代码思维，掌握可视化建站引擎。\n- **Howard**：注册 Shopify 试用账号，掌握 Shopify 后台架构、域名解析、支付配置（PayPal/Stripe 模版）、运费模版配置及基础应用插件。\n- **Brian**：学习 Shopify PageFly / Shogun 或 WordPress Elementor 拖拽排版，掌握网格留白、响应式移动端适配（Mobile-First）。\n\n### Day 3 ~ Day 4：AI 英文营销文案与欧美视觉生成 (Howard + Brian)\n- **Howard**：训练 Claude / ChatGPTPrompt 模版——输入产品功能参数，输出符合欧美文化习惯的 Brand Story、Hero Banner 标语、痛点对比表及 FAQ。\n- **Brian**：主攻 Midjourney / SD / Flux 生成欧美本土模特图（European & American Lifestyle）、极简 3D 渲染光影感产品场景图与透明底展示图。\n\n### Day 5 ~ Day 7：打造首个虚拟品牌 Demo 样板站 (实操跑通)\n- **目标**：选定 1 个品类（如“智能户外储能电源”或“极简智能咖啡机”），完成 1 个 100% 具备大厂品质的演示独立站。\n- **产出**：将 Demo 站录屏、截图并打包为《Gensight 出海品牌独立站案例实录》。\n\n---\n\n## 2. 两人协同交付 SOP (Howard & Brian)\n\n```\n阶段 1: 询盘与签约 (Howard主导)\n├─ 1.1 15 分钟内响应客户咨询，评估出海品类与目标市场\n├─ 1.2 发送《出海独立站产品手册与案例 Demo》\n└─ 1.3 确定需求梯队，签署线上协议，收取 50% 订金\n\n阶段 2: 策略定义与素材生产 (双人并发)\n├─ Howard (策略与文案):\n│   ├─ 2.1 品牌定位与价值主张提取\n│   └─ 2.2 使用 Claude 生成全站英文 Copywriting\n└─ Brian (视觉与素材):\n    ├─ 2.3 生成符合欧美审美的主视觉 Banner\n    └─ 2.4 使用 MJ/Flux 精修 10 款主力产品场景图\n\n阶段 3: No-Code 建站与整合 (两人协同)\n├─ 3.1 Shopify/WP 站点搭建与页面组装 (Howard配后台，Brian做排版)\n├─ 3.2 移动端 (Mobile) 与 Web 端双端适配测试\n└─ 3.3 对接域名、支付接口、物流模版与基础 SEO\n\n阶段 4: 交付验收与后续转化 (Howard主导)\n├─ 4.1 远程演示站点，提交客户验收并收取 50% 尾款\n├─ 4.2 交付站点管理权限与 1 小时使用培训视频\n└─ 4.3 引导客户签署《海外广告视觉与素材月包 (¥5,680/月)》\n```\n", "08-asset-ops.md": "# OPC 08 · 跨境视觉资产沉淀\n\n> 状态：**运营期循环**（按需触发，非每日必读）  \n> 适用：跨境视觉外包主线 — Amazon、美客多、Shopee、TikTok、SHEIN、Shopify\n\n---\n\n## 1. 什么值得沉淀\n\n只沉淀**会重复用三次以上**的成果，避免堆笔记：\n\n| 资产类型 | 典型产物 | 存放位置 |\n| --- | --- | --- |\n| Prompt / 工作流 | 平台风格、Lifestyle 模特、CTR 对比图模板 | 飞书文档库 + T08 案例库关联 |\n| 交付模板 | Listing 八件套文件夹结构、命名规范 | 飞书云盘 + [`learning-and-sop-roadmap.md`](./learning-and-sop-roadmap.md) |\n| 报价话术 | 体验包 / 月包标准说明 | T10 产品与报价 + 本站 [产品与报价](./product-spec-and-pricing.md) |\n| 案例包 | 脱敏前后对比、平台规格说明 | T08 + [Demo 与案例](./visual-portfolio-showcase.md) |\n| 触达素材 | 免费诊断对比卡、LinkedIn/邮件开场 | 飞书文档库（内部） |\n\n国内设计相关资产（Logo/VI/PPT）**不主动扩展**；仅在有成单时按项目归档。\n\n---\n\n## 2. 沉淀优先级（当前阶段）\n\n1. **跨境 Listing / 广告 KV Prompt 库** — 直接支撑触达与交付速度  \n2. **1 套完整 Demo 案例包装** — 支撑定向触达转化  \n3. **平台尺寸导出 checklist** — 减少交付返工  \n4. 国内零星案例 — 仅作机会型参考\n\n---\n\n## 3. 触发条件\n\n在以下信号出现时再打开本页，不必每日阅读：\n\n- 同一类 Prompt 或修图步骤重复出现 ≥3 次  \n- 客户问的问题高度相似，需要标准回答  \n- 某平台交付返工集中在同一环节（尺寸、文案、合规）\n\n---\n\n## 4. 完成标准\n\n- 资产有**唯一命名**、**版本日期**、**适用平台**  \n- 在飞书文档库有一条索引，并可关联到 T01/T08  \n- 本站仅保留**索引与 SOP**，不存源文件权威副本\n", "09-dashboard-review.md": "# OPC 09 · 经营复盘与瓶颈识别\n\n> 状态：**运营期循环**（周复盘必读，日复盘见飞书 T06）  \n> 数据权威来源：**飞书 T06 晚间复盘 + T05 询盘 + T10 成交**\n\n---\n\n## 1. 日复盘（飞书 T06）\n\n每日 21:00 填写，字段对齐 [每日执行 SOP](./daily-action-and-review-guide.md) 四问：\n\n1. 今日亮点与战果（进账、触达、有效回复）  \n2. 今日瓶颈（交付/沟通/工具）  \n3. 新假设与机会（平台/类目/报价）  \n4. Stop / Keep / Start → **次日 Top 3 写回 T04**\n\nGitHub Pages **不保存**日复盘内容。\n\n---\n\n## 2. 周复盘（周五或周日，30 分钟）\n\n### 必看三数（从飞书汇总）\n\n| 指标 | 来源 | 健康参考（可调） |\n| --- | --- | --- |\n| 有效触达 | T06 / T05 | 周 ≥25 次定向触达 |\n| 有效回复 | T05 | 周 ≥3 个深度对话 |\n| 现金流 | T06 + 收款记录 | 体验包或月包订金 ≥1 单 |\n\n### 每周只写一条「唯一主线」\n\n格式见 [当前运营基线](./00-current-operating-baseline.md) §5。写入：\n\n- 飞书 T04 本周首行或单独「周目标」视图  \n- `portal/site-config.json` → `weeklyGoal`（同步到 Pages 首页展示）\n\n---\n\n## 3. 瓶颈识别（Stop-loss）\n\n| 信号 | 动作 |\n| --- | --- |\n| 连续 2 周触达无有效回复 | 换平台或换触达话术，复盘 Demo 是否够锋利 |\n| 交付反复返工同一规格 | 补平台 checklist，沉淀到 T08/Prompt 库 |\n| 国内机会单挤占跨境交付 | Stop 主动接国内单，Keep 已预付交付 |\n| 两人在多个计划文档间争论「今天做什么」 | 回到基线 + 飞书 T04，不开新文档 |\n\n---\n\n## 4. 与 OPC 其他阶段的关系\n\n- 01–07 建盘期文档：**已完成梳理**，冲突时以 [00-current-operating-baseline.md](./00-current-operating-baseline.md) 为准  \n- 08 资产沉淀：复盘发现重复劳动时触发  \n- 根目录 `00–18` 国内规划：**历史参考**，不进入周计划\n", "05-crossborder-opc-master-plan.md": "# 元晟传媒 (Gensight) - 出海独立站全案 OPC 运营方案总纲 (Master Blueprint)\n\n> 版本：2026-08 战略与运营全纲  \n> 责任人：Howard (COO / 策略) & Brian (视觉 / 出图)  \n\n---\n\n## 1. 战略共识与四象限对齐\n\n根据四象限法则（共同已知、我的已知/你的未知、我的未知/你的已知、共同未知），本方案确立以下基石：\n\n- **共同已知**：摆脱广告商低价代工与企AI长周期落地的泥潭，转向**出海独立站高溢价全案（策略 + 欧美视觉 + No-Code 搭站 + 广告视觉月包）**。\n- **我的未知 / 你的已知 (避坑提醒)**：绝不做纯底层代码开发；核心难点不在建站技术，而在**符合欧美审美的英文 Copywriting、品牌故事与大厂级视觉**。采用 No-Code 引擎 3~5 倍提效。\n- **共同未知 (MVP 假设)**：14 天内能否用 1 个精品 Demo 站获得 5+ 精准外贸/D2C 企业主私信，并卖出 ¥1,980 诊断包或 ¥19,800 全案？\n\n---\n\n## 2. 核心里程碑与时间节点\n\n```\n[ Phase 1: 0-7 天 技能速成与 Demo 样板建盘 ]\n├── Day 1-2: 掌握 Shopify / Elementor 可视化拖拽搭建与后台配置\n├── Day 3-4: 跑通 Claude 英文营销文案 Prompt 与 Midjourney 欧美 Lifestyle 模特图\n└── Day 5-7: 打造首个“智能户外电源”极简大厂风 Demo 样板站\n\n[ Phase 2: 8-14 天 全网内容发酵与首单试水 ]\n├── Day 8-10: 制作《欧美独立站拆解与 AI 建站实录》发布于小红书、领英、外贸社群\n├── Day 11-12: 跑通 15 分钟咨询接待 SOP，主推 ¥1,980 独立站诊断包\n└── Day 13-14: 争取跑通首个 ¥19,800 出海独立站标准包签约\n\n[ Phase 3: 15-30 天 标准化交付与月代制作包续费 ]\n├── 按两人协同 SOP 7-10 天高标准交付独立站\n└── 引导客户按季签署 ¥5,680 / 月的海外广告视觉代制作包，锁定长期 LTV\n```\n\n---\n\n## 3. 关联运营细则文档索引\n\n- 📄 **产品与报价手册**：[product-spec-and-pricing.md](./product-spec-and-pricing.md)\n- 📄 **7天学习计划与两人 SOP**：[learning-and-sop-roadmap.md](./learning-and-sop-roadmap.md)\n- 📄 **Demo 样板站选型与策划**：[demo-case-blueprint.md](./demo-case-blueprint.md)\n- 📄 **OPC 利基定位升级版**：[02-niche-positioning.md](./02-niche-positioning.md)\n- 📄 **OPC 精益商业模式画布**：[04-business-model.md](./04-business-model.md)\n", "01-resource-audit.md": "# 元晟传媒 (Gensight) - OPC 01 资源盘点\n\n> 状态：已完成梳理 (已根据 Gensight 项目基线文件 00~18 自动对齐)  \n> 责任人：Howard + Brian  \n\n---\n\n## 1. 团队与个人资源盘点（8 大维度）\n\n| 维度 | Gensight 现状与优势 | 约束与边界 |\n|---|---|---|\n| **1. 技能与专业深度** | **Howard**：策略制定、文案策划、AI 提效应用、品牌架构、SOP与流程设计；<br>**Brian**：视觉设计、美工制作、物料延展、设计落地。 | 团队仅 2 人，需高度自动化与模板化，不能陷入低单价、重复劳作的劳动密集型纠缠。 |\n| **2. 认知与行业经验** | 拥有品牌策略、视觉设计、广告 KV、PPT 汇报、商业效果图、多淼本地制作合作经验。 | 8 月前公司未正式注册完成，7 月以个人/个体账号形式过渡运营。 |\n| **3. 现有资产与案例** | 半间茶舍、汇泽万帮、文家姑娘、米兰坊、铺宝宝、讲宪法等实战案例资产及对外标准报价单。 | 部分政务及渠道案例存在脱敏要求，需制作脱敏版案例库与视觉样板。 |\n| **4. 新杠杆 (AI 提效)** | 使用 Midjourney / Stable Diffusion / Flux / AI 辅助排版与营销文案生成，设计效能提升 3~5 倍。 | 对外定位为「策略先于执行，专业驾驭效能」，不卖低端 AI 无脑贴图，不主推企业 AI 咨询。 |\n| **5. 渠道与触达能力** | 小红书（视觉/自媒体）、闲鱼（高频搜索/体验款）、微信朋友圈（熟人/转介绍）、多淼渠道（苏州本地制作）。 | 公众号等企业账号需待 8 月公司注册完成后开启；目前缺乏高并发投流预算。 |\n| **6. 资金与风险承受** | 精益轻资产启动，无需大额固定资产投入；Mac + 协同开发与飞书多维表格降本增效。 | 90 天内需快速产生稳定现金流，支撑公司注册与团队基础运营。 |\n| **7. 合作生态** | 与「多淼」保持战略合作（提供线下制作、安装、空间落地支持），具备线上线上联合交付能力。 | 独立设计业务与多淼联合业务边界需划分清晰（独立业务自负盈亏，联合业务明晰主导权）。 |\n| **8. 时间与精力分布** | 两人全职协同；Howard主导策略、文案与运营，Brian主导视觉设计与物料出图。 | 两人每日工作须严格依据协同工作台/飞书表格推进，杜绝内耗与无效沟通。 |\n\n---\n\n## 2. 结论与下一步\n\n- **核心竞争力**：AI 提效加持下的高品质策略型品牌设计交付能力。\n- **下一 OPC 阶段**：`02-niche-positioning`（利基定位）— 锁定 5 类核心业务与三环叠加切入点。\n", "02-niche-positioning.md": "# 元晟传媒 (Gensight) - OPC 02 利基定位 (5大跨境平台与独立站素材外包版)\n\n> 状态：2026-08 平台精细化定稿版  \n> 战略原则：**【专注跨境视觉外包】覆盖 美客多 / 亚马逊 / Shopee / TikTok / SHEIN / Shopify 6 大场景**  \n\n---\n\n## 1. 5 大跨境平台与独立站视觉定位矩阵\n\n1. **亚马逊 (Amazon)**：Listing 1:1 主图/附图、A+ 页面模块、品牌旗舰店 Header（注重白底合规与欧美高质感）。\n2. **美客多 (Mercado Libre)**：拉美市场西班牙语/葡萄牙语 Listing 1:1 视觉与 Header（Howard 亲自操刀多语种文案）。\n3. **Shopee**：东南亚高饱和度促销氛围 Feed、Flash Sale 挂框图与 2:1 轮播 Banner。\n4. **TikTok (Shop & Ads)**：9:16 竖屏高 CTR 广告 Feed 卡片、Carousel 轮播图与微动效素材。\n5. **SHEIN**：3:4 时尚/生活方式 Lookbook 视觉、杂志感大图与促销 Banner。\n6. **Shopify 独立站**：16:9 欧美 DTC 大厂极简风格 Hero Banner 与 Collection 排版。\n\n---\n\n## 2. 精细化交付物数量与定价\n\n- **单套点播包 (选定平台 Listing 升级包)**：1 张高精主图 + 6 张卖点/场景附图 + 1 套 Banner (包多语种文案) ➔ **国内 ¥1,680 / 海外 $280 USD**\n- **主力月包 (跨平台素材代制作包)**：每月 12 套跨平台广告 KV (共 36 张图) + 4 套 Listing 包 + 8 组 TikTok 广告卡 ➔ **国内 ¥6,800/月 / 海外 $1,350 USD/月**\n- **体验试用包 (3套高 CTR 素材包)**：选定平台 3 套广告 KV (共 6 张图) ➔ **国内 ¥880/次 / 海外 $150 USD/次**\n", "03-value-proposition.md": "# 元晟传媒 (Gensight) - OPC 03 价值主张\n\n> 状态：已完成梳理  \n> 核心分析工具：**客户价值主张画布 (Value Proposition Canvas)**  \n\n---\n\n## 1. 客户 Profile 拆解\n\n### 目标客户群：中小型企业主 / 创业者 / 项目负责人 / 广告公司采购\n\n### 1.1 客户任务 (Customer Jobs)\n- 需要一套专业高档的品牌 Logo 和 VI 应用来吸引客户与投资人。\n- 需要在 3~7 天内完成重要的发布会 KV、路演 PPT 或店铺门头效果图。\n- 需要有专业策略眼光的团队帮其整理乱七八糟的品牌诉求。\n\n### 1.2 客户痛点 (Customer Pains)\n- **痛点 A (贵且慢)**：传统 4A/大设计公司动辄数万且周期 1 个月以上，沟通成本高。\n- **痛点 B (廉价且质差)**：找淘宝/低价淘宝美工，出来的效果同质化、土气、无商业策略。\n- **痛点 C (不可落地)**：很多设计图好看但线下根本无法印刷或施工安装。\n\n### 1.3 客户期望收益 (Customer Gains)\n- **收益 A**：用中等预算获得大厂级视觉效果。\n- **收益 B**：超快交付，不耽误业务发布与融资进度。\n- **收益 C**：线上设计与线下制作（多淼合作）无缝衔接，落地不踩坑。\n\n---\n\n## 2. 价值主张设计 (Value Proposition Fit)\n\n| 产品与服务 | 痛点缓解器 (Pain Relievers) | 收益创造器 (Gain Creators) |\n|---|---|---|\n| **策略型 AI 视觉设计** | 拒绝低端套版，由策略师+资深美工双重把关。 | AI 提效 3~5 倍，让精品设计价格降低 50%+。 |\n| **快速响应交付 SOP** | 明确 3~7 天交付节点，每天推送进展。 | 客户心里有底，比传统公司快 3 倍。 |\n| **线上+线下联合能力** | 多淼苏州本地实操经验，保障施工印刷可用。 | 从屏幕效果到实体落地一站式不踩坑。 |\n\n---\n\n## 3. 核心价值主张声明 (Value Proposition Statement)\n\n> **对外一句话**：  \n> **\"策略先于执行，专业驾驭效能 — 元晟传媒为您打造大厂级品牌视觉与超速交付方案。\"**\n\n---\n\n## 4. 下一步\n\n- **下一 OPC 阶段**：`04-business-model`（商业模式精益画布）。\n", "04-business-model.md": "# 元晟传媒 (Gensight) - OPC 04 商业模式 (双引擎精益画布版)\n\n> 状态：已更新双引擎画布  \n> 核心工具：**双引擎精益商业模式画布 (Dual-Engine Lean Canvas)**  \n\n---\n\n## 1. 双引擎精益画布\n\n```\n+------------------------+------------------------+------------------------+------------------------+------------------------+\n| 1. 问题 (Problem)      | 4. 解决方案 (Solution) | 3. 价值主张 (UV)       | 9. 门槛优势 (Unfair)   | 2. 客户细分 (Customer) |\n| - 纯代工议价权低       | - 双引擎驱动模型       | - 策略先于执行         | - Howard 25年商业高管  | 引擎A: 广告公司/本地企业|\n| - 纯出海独立站初期需研发 | - 引擎A: 海报/PPT/效果图 | - 视觉撬动商业转化     | - Brian 欧美视觉+AI    | 引擎B: 出海工贸一体工厂|\n| - 需保障每日现金流安全  | - 引擎B: 出海独立站全案 | - 既保即时现金流       | - 双人 3~5 倍 AI 提效  |   国内 D2C 品牌出海    |\n|                        |                        |   又拿海外高客单溢价   | - 已变现¥1.5万客户基础 |   独立站精品卖家       |\n+------------------------+------------------------+------------------------+------------------------+------------------------+\n| 8. 关键指标 (Metrics)                            | 5. 渠道 (Channels)                              |\n| - 引擎A 现金流月流转 (已达成 ¥1.5万)            | - 引擎A: 合作广告商转介绍、已有客户复购        |\n| - 引擎B 出海独立站签单率 (目标 >¥19,800)         | - 引擎B: 小红书/领英出海案例拆解、出海生态联盟   |\n+------------------------+------------------------+------------------------+------------------------+------------------------+\n| 7. 成本结构 (Cost Structure)                     | 6. 收入流 (Revenue Streams)                     |\n| - SaaS 订阅 (Shopify/MJ/Claude)                  | - 引擎A 现金流: 广告KV/海报/PPT/效果图/VI       |\n| - 两人团队极简人力成本 (无固定大额房租)          | - 引擎B 溢价流: 独立站全案 (¥19.8K~¥39.8K)     |\n|                                                | - 引擎B 续费流: 海外广告视觉月包 (¥5,680/月)    |\n+------------------------+------------------------+------------------------+------------------------+------------------------+\n```\n\n---\n\n## 2. 两人团队精力分配 (30/70 法则)\n\n- **30% 精力 (现金流维护)**：\n  - 承接广告公司与常规直客的海报、PPT、效果图包，快速交货，拿到即时现金流，维持日常运营。\n- **70% 精力 (出海独立站攻坚)**：\n  - No-Code 建站攻坚、打造 LUMINA 智能电源 Demo 样板站、小红书/领英出海内容发酵。\n", "06-mvp-design.md": "# 元晟传媒 (Gensight) - OPC 06 MVP 设计\n\n> 状态：已完成梳理  \n> 周期：14 天 MVP 验证期  \n\n---\n\n## 1. MVP 核心假设与目标\n\n**最小可行验证 (MVP) 目标**：在不进行大额投流与公司正式开业前，用最轻资源验证市场对元晟视觉设计服务的付赞意愿与询盘转化路径。\n\n---\n\n## 2. MVP 两大触达阵地\n\n### 阵地 1：小红书自媒体品牌样板展示\n- **验证形式**：发布 6~10 篇高品质案例拆解图文（半间茶舍、米兰坊、文家姑娘等）。\n- **指标**：获得 50+ 互动，引流 10+ 微信私信咨询。\n\n### 阵地 2：闲鱼高频搜索体验款\n- **验证形式**：上架低价/入门级设计体验商品（如 Logo 基础诊断、简易排版试水）。\n- **目的**：利用咸鱼搜索流量筛选高意向直客，导流至微信转化为 ¥1,980+ 套件。\n\n---\n\n## 3. MVP 验证交付物边界\n\n| 包含在 MVP 验证内 | 严格排除在 MVP 之外 |\n|---|---|\n| 01-18 现有文档的报价单与对外物料 | 大规模自动化网站开发 |\n| 飞书多维表格与本地工作台双轨协同 | 大额小红书/抖音付费投流 |\n| 微信客服承接与定制商业提案 PDF | 无边界的免费试稿与无底线改稿 |\n\n---\n\n## 4. 下一步\n\n- **下一 OPC 阶段**：`07-conversion-loop`（转化闭环）。\n", "demo-case-blueprint.md": "# 元晟传媒 (Gensight) - 首个 Demo 样板案例选型与制作思考\n\n> 版本：2026-08 样板站策划案  \n> 目的：在不依赖真实客户订单的情况下，用 3 天打造一个具备百万美元品牌质感的出海独立站 Demo，作为全网发帖与谈单的核武器。  \n\n---\n\n## 1. 样板选型思考：为什么选“智能户外移动电源 / 户外装备”？\n\n经过对出海市场需求与团队能力匹配度评估，首个 Demo 确定选型为：**“LUMINA - 智能便携式户外电源 & 太阳能快充系统”**（或高级智能胶囊咖啡机）。\n\n### 选型逻辑：\n1. **出海热度极高**：户外电源、便携储能、智能小家电是近年来中国工贸一体企业出海（如 Jackery 猎户座、Anker 阳台光伏）最火爆、预算充足的品类。\n2. **视觉冲击力强**：户外场景（森林露营、雪线越野、房车旅行）天然适合 Midjourney 生成极富视觉震撼力的欧美真实 Lifestyle 大图。\n3. **策略溢价明显**：工贸工厂做此类产品往往只堆砌电池容量参数；Gensight 可以展示如何将“电池参数”包装为“Freedom Anywhere (随处自由)”的欧美品牌生活方式。\n\n---\n\n## 2. Demo 样板站 5 大核心页面架构\n\n1. **Homepage (首页)**：\n   - Hero Banner：极具视觉冲击力的欧美野外露营大图，配高透文字：“Power Your Wildest Dreams.”\n   - 痛点对比区： Traditional Heavy Generator (笨重传统发电机) vs LUMINA Smart Power (轻量智能储能)。\n   - 商业信任背书 (Trust Grid)：展示 4.9 星评价、海外媒体报道标志 (TechCrunch, Forbes 等占位设计)。\n2. **Product Detail Page (产品详情页)**：\n   - 3D 渲染感爆炸图（展示内部安全电芯与散热架构）。\n   - 场景化插图：户外无人机充电、咖啡机供电、应急医疗保障。\n   - 购买转化按钮与倒计时优惠挂件。\n3. **Brand Story (品牌故事页)**：\n   - 创始人理念：为什么我们要设计一款让环保与野外探索完美融合的电源？\n4. **Technology & Safety (技术与安全页)**：\n   - 强调 BMS 智能电池管理系统与极值耐温技术。\n5. **Support & FAQ (售后与常见问题页)**：\n   - 海外 2 年质保说明、全球仓发货与常见使用问答。\n\n---\n\n## 3. Demo 成果包装与全网传播\n\nDemo 站制作完成后，将其转化为 3 大宣传资产：\n1. **静态长图案例**：《如何用 AI 3 天打造一个大厂级出海品牌独立站？》发布于小红书与微信公众号。\n2. **视频漫游**：录制 1 分钟高清屏幕漫游视频，配英文音效，展示移动端/Web 端动态效果。\n3. **提案 PDF 附件**：把 Demo 站各版块截图直接放入给客户的《Gensight 商业合作提案》中作为实力背书。\n", "README.md": "# 元晟传媒 (Gensight) - OPC 一人企业方法论规划文档库\n\n本目录是依据 [OPC 方法论 (LucasCyberLab/opc-methodology)](https://github.com/LucasCyberLab/opc-methodology.git) 建立的项目规划与执行分析库。\n\n## OPC 阶段规划架构\n\n| 阶段编号 | 阶段名称 | 状态 | 对应产物文档 | 核心关注点 |\n|---|---|---|---|---|\n| **01** | **资源盘点** | 待确认/已梳理 | [01-resource-audit.md](./01-resource-audit.md) | Howard/Brian 8类资源盘点、AI新杠杆与约束评估 |\n| **02** | **利基定位** | 待确认/已梳理 | [02-niche-positioning.md](./02-niche-positioning.md) | AI视觉/品牌设计利基选择、六维评分与不竞争策略 |\n| **03** | **价值主张** | 待确认/已梳理 | [03-value-proposition.md](./03-value-proposition.md) | 客户Jobs/Pains/Gains分析与高转化价值主张声明 |\n| **04** | **商业模式** | 待确认/已梳理 | [04-business-model.md](./04-business-model.md) | 精益画布 (Lean Canvas) 填写与最危险假设识别 |\n| **06** | **MVP 设计** | 待确认/已梳理 | [06-mvp-design.md](./06-mvp-design.md) | 跨境视觉体验包与定向触达验证 |\n| **07** | **转化闭环** | 当前 | [07-conversion-loop.md](./07-conversion-loop.md) | 跨境触达 → 飞书询盘 → 交付 → 案例复购 |\n| **08** | **资产沉淀** | 运营期循环 | [08-asset-ops.md](./08-asset-ops.md) | Prompt/模板/案例库沉淀（按需触发） |\n| **09** | **经营复盘** | 运营期循环 | [09-dashboard-review.md](./09-dashboard-review.md) | 飞书 T06 日复盘 + 周唯一主线 |\n\n---\n\n## 执行与协作（当前优先）\n\n| 文档 | 用途 |\n| --- | --- |\n| [00-current-operating-baseline.md](./00-current-operating-baseline.md) | 唯一业务判断入口 |\n| [feishu-daily-workflow.md](./feishu-daily-workflow.md) | 飞书表与任务字段标准 |\n| [storage-and-pages-boundary.md](./storage-and-pages-boundary.md) | Pages vs 飞书边界 |\n| [daily-warroom-validation.md](./daily-warroom-validation.md) | 双人一日演练清单 |\n| [archive-domestic-plans.md](./archive-domestic-plans.md) | 国内 00–18 历史归档索引 |\n\n## 关联参考资料\n\n- OPC 方法论完整原书：[docs/opc-methodology/](../docs/opc-methodology/)\n- 国内历史规划（不进入跨境日计划）：见 [archive-domestic-plans.md](./archive-domestic-plans.md)\n- 飞书多维表格协同方案：[16-feishu-bitable-workbench-plan.md](../16-feishu-bitable-workbench-plan.md)\n", "archive-domestic-plans.md": "# 国内设计业务 · 历史规划归档索引\n\n> 状态：**历史 / 机会型现金流参考**  \n> 适用条件：仅在有国内设计自然询盘时查阅；**不进入跨境视觉日计划与首页主推**  \n> 当前主线见 [00-current-operating-baseline.md](./00-current-operating-baseline.md)\n\n---\n\n## 文档状态说明\n\n| 标记 | 含义 |\n| --- | --- |\n| **历史** | 2026-07 国内设计获客冲刺，策略已被跨境视觉主线取代 |\n| **机会型** | 可承接零星订单时的操作参考 |\n| **仍有用** | 部分内容可复用到报价话术或交付标准 |\n\n---\n\n## Root 执行文档（00–18）\n\n| 文件 | 标题/用途 | 状态 | 备注 |\n| --- | --- | --- | --- |\n| `00-foundation-review.md` | 基础盘点 | 历史 | 国内业务启动前梳理 |\n| `00-startup-checklist.md` | 启动清单 | 历史 | 公司注册/账号类 |\n| `01-business-plan.md` | 商业计划 | 历史 | 国内设计方向 |\n| `02-channel-internal-pricing.md` | 渠道内部价 | 机会型 | 广告公司渠道价参考 |\n| `03-public-pricing.md` | 对外公开价 | 机会型 | 国内 5 类主推产品价 |\n| `04-social-media-plan.md` | 自媒体计划 | 历史 | 小红书/公众号国内获客 |\n| `05-90-day-execution-calendar.md` | 90 天日历 | 历史 | 国内业务节奏 |\n| `06-case-packaging-library.md` | 案例包装库 | 仍有用 | 案例脱敏流程可复用 |\n| `07-content-first-month.md` | 首月内容 | 历史 | 国内内容方向 |\n| `08-sales-and-intake-sop.md` | 销售接待 SOP | 仍有用 | 15 分钟响应原则通用 |\n| `09-duomiao-partnership.md` | 多淼协作 | 机会型 | 联合项目边界 |\n| `10-two-person-execution-plan.md` | 双人执行 | 历史 | 被飞书 T04 取代 |\n| `11-xianyu-channel-pilot.md` | 闲鱼试点 | 历史 | 非跨境主渠道 |\n| `12-company-profile-delivery-standards.md` | 企业介绍交付标准 | 仍有用 | 物料尺寸规范 |\n| `13-commercial-proposal-service.md` | 商业提案 | 机会型 | 国内提案结构 |\n| `14-strategy-case-placement.md` | 案例摆放策略 | 历史 | |\n| `15-company-registration-roadmap.md` | 公司注册 | 历史 | 不阻塞当前获客 |\n| `16-feishu-bitable-workbench-plan.md` | 飞书工作台 | **当前** | 协作系统总纲 |\n| `17-7-day-work-sprint.md` | 7 天冲刺 | 历史 | 国内设计+弱化 Logo |\n| `18-social-media-content-sprint.md` | 社媒内容冲刺 | 历史 | 国内内容排期 |\n\n---\n\n## 策略冲突说明\n\n- **`17-7-day-work-sprint.md`**：主张国内设计现金流优先 → **已归档**，跨境视觉为主线  \n- **`opc-doc/02-niche-positioning.md` 等**：跨境视觉 OPC 梳理 → **当前战略参考**  \n- **本机 `archive/app.js`**：2026-07 国内日计划驱动 → **已退役**\n\n在 GitHub 上查看原文：仓库根目录对应文件名（Pages 不嵌入全文，避免与首页作战台竞争）。\n", "daily-warroom-validation.md": "# 双人一日工作流 · 演练与验收清单\n\n> 版本：2026-08-04  \n> 用途：验证「今日作战台 + 飞书 + 本站 SOP」能否支撑完整一日，无需翻阅战略长文。\n\n---\n\n## 演练场景\n\n**参与者**：Howard、Brian  \n**时间盒**：完整一日（可压缩为 90 分钟桌面演练）  \n**成功标准**：10 分钟内各自确认 1–3 个任务，且能写出当日唯一可验收输出。\n\n---\n\n## A. 晨会（09:00，≤15 分钟）\n\n| 步骤 | 操作 | 通过标准 |\n| --- | --- | --- |\n| A1 | 打开 GitHub Pages **今日作战台** | 可见本周唯一目标、三项指标入口、飞书链接 |\n| A2 | 打开飞书 **T04 每日任务** | 每人已有或新建 1–3 条今日任务 |\n| A3 | 检查 **T01 任务交接** 待接手 | 阻塞项在晨会读出，有解除     if (state.addonMultiLang) { total += pLang; text += `• 西/葡多语种本土化文案包: ${symbol}${pLang.toLocaleString()}\n`; }

  <script>(() => {
  const groupLabels = {
    start: "今日必读",
    do: "执行时打开",
    tools: "工具",
    reference: "战略参考",
    archive: "历史归档",
  };

  let activeView = "warroom";
  let activeFile = null;

  function feishuUrl(tableKey) {
    const base = siteConfig.feishu?.baseUrl || "";
    const table = siteConfig.feishu?.tables?.[tableKey];
    if (!base) return "";
    if (table?.path) return base.replace(/\/$/, "") + "/" + table.path.replace(/^\//, "");
    return base;
  }

  function renderWarroom() {
    const el = document.getElementById("warroom");
    if (!el) return;
    const goal = siteConfig.weeklyGoal || "";
    const owner = siteConfig.weeklyGoalOwner || "";
    const due = siteConfig.weeklyGoalDue || "";
    const baseUrl = siteConfig.feishu?.baseUrl || "";
    const setupNote = siteConfig.feishu?.setupNote || "配置 portal/site-config.json 后重建站点";

    const metricsHtml = (siteConfig.metrics || [])
      .map((m) => {
        const url = feishuUrl(m.table);
        const link = url
          ? `<a href="${url}" target="_blank" rel="noreferrer">在飞书填写 →</a>`
          : `<button type="button" class="linkish" disabled title="${setupNote}">先配置飞书链接</button>`;
        return `<article class="metric-card"><div class="label">${m.label}</div><h3>—</h3><p>${m.hint}</p>${link}</article>`;
      })
      .join("");

    const tables = siteConfig.feishu?.tables || {};
    const tableButtons = Object.entries(tables)
      .map(([key, t]) => {
        const url = feishuUrl(key);
        const cls = url ? "feishu-btn" : "feishu-btn disabled";
        const href = url || "#";
        return `<a class="${cls}" href="${href}" target="_blank" rel="noreferrer">${t.code} ${t.label}</a>`;
      })
      .join("");

    el.innerHTML = `
      <section class="warroom">
        <div class="warroom-head">
          <div>
            <p class="eyebrow">今日作战台 · Howard & Brian</p>
            <h1>打开这里，开始今天的工作。</h1>
            <p class="warroom-lead">任务、线索、成交与复盘以飞书为准。本站只回答：本周目标是什么、今天优先做什么、需要时去哪查 SOP 与报价。</p>
          </div>
          <aside class="goal-card">
            <strong>本周唯一目标</strong>
            <p>${goal}</p>
            <div class="goal-meta">${owner ? `负责人 ${owner}` : ""}${due ? ` · 截止 ${due}` : ""}</div>
          </aside>
        </div>
        <p class="section-label">关键数字 · 在飞书维护权威状态</p>
        <div class="metrics-row">${metricsHtml}</div>
        <div class="panels-row">
          <article class="panel">
            <h3>今日 Top 3（写在飞书 T04）</h3>
            <p>晨会各确认 1–3 项，必须可验收。复制模板到飞书填写，本站不保存。</p>
            <ol>
              <li>Howard：有效触达 / 询盘跟进 / Brief</li>
              <li>Brian：对比卡 / Listing 交付 / Prompt 沉淀</li>
              <li>共同：阻塞项解除或升级</li>
            </ol>
            <button type="button" class="copy-template-btn" id="copyTop3">复制 Top 3 模板</button>
          </article>
          <article class="panel">
            <h3>当前阻塞（写在飞书 T01）</h3>
            <p>状态 = 被阻塞 的任务必须在晨会读出。复制模板记录原因与解除条件。</p>
            <ol>
              <li>阻塞任务：</li>
              <li>原因：</li>
              <li>解除条件 / 负责人：</li>
            </ol>
            <button type="button" class="copy-template-btn" id="copyBlocker">复制阻塞项模板</button>
          </article>
        </div>
        <section class="feishu-bar">
          <div>
            <h2>飞书多维表格 · 唯一协作数据源</h2>
            <p>GitHub Pages 不保存任务或客户数据。${baseUrl ? "点击下方进入对应表。" : setupNote}</p>
            ${baseUrl ? "" : `<div class="feishu-note">编辑 portal/site-config.json → python3 build_opc_html.py</div>`}
          </div>
          <div class="feishu-actions">
            ${baseUrl ? `<a class="feishu-btn primary" href="${baseUrl}" target="_blank" rel="noreferrer">打开飞书 Base</a>` : ""}
            ${tableButtons}
          </div>
        </section>
      </section>`;

    document.getElementById("copyTop3")?.addEventListener("click", () => {
      const d = new Date().toISOString().slice(0, 10);
      const text = `【${d} 今日 Top 3 — 写入飞书 T04】\nHoward:\n1.\n2.\n3.\nBrian:\n1.\n2.\n3.\n本周目标：${goal}`;
      navigator.clipboard.writeText(text).then(() => alert("Top 3 模板已复制，请粘贴到飞书。"));
    });
    document.getElementById("copyBlocker")?.addEventListener("click", () => {
      const text = `【阻塞项 — 写入飞书 T01】\n任务：\n阻塞原因：\n解除条件：\n负责人：\n期望解除日：`;
      navigator.clipboard.writeText(text).then(() => alert("阻塞项模板已复制，请粘贴到飞书。"));
    });
  }

  function buildNav() {
    const nav = document.getElementById("nav");
    nav.innerHTML = "";

    const homeBtn = document.createElement("button");
    homeBtn.className = "nav-item nav-home";
    homeBtn.innerHTML = `今日作战台<small>本周目标 · Top 3 · 飞书入口</small>`;
    homeBtn.addEventListener("click", showWarroom);
    nav.appendChild(homeBtn);

    for (const group of ["start", "do", "tools", "reference", "archive"]) {
      nav.insertAdjacentHTML("beforeend", `<div class="nav-group">${groupLabels[group]}</div>`);
      manifest
        .filter((item) => item.group === group)
        .forEach((item) => {
          const button = document.createElement("button");
          button.className = "nav-item";
          button.dataset.file = item.file;
          button.innerHTML = `${item.title}<small>${item.description}</small>`;
          if (item.view === "calculator") {
            button.addEventListener("click", showCalculator);
          } else {
            button.addEventListener("click", () => openDocument(item.file));
          }
          nav.append(button);
        });
    }
  }

  function setActiveNav(fileOrView) {
    document.querySelectorAll(".nav-item").forEach((btn) => {
      const match = fileOrView === "warroom" ? btn.classList.contains("nav-home") : btn.dataset.file === fileOrView;
      btn.classList.toggle("active", match);
    });
  }

  function showWarroom() {
    activeView = "warroom";
    activeFile = null;
    document.getElementById("warroom").style.display = "block";
    document.getElementById("docView").style.display = "none";
    document.getElementById("calcView").style.display = "none";
    setActiveNav("warroom");
    window.location.hash = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function showCalculator() {
    activeView = "calculator";
    activeFile = "__calculator__";
    document.getElementById("warroom").style.display = "none";
    document.getElementById("docView").style.display = "none";
    const calc = document.getElementById("calcView");
    calc.style.display = "block";
    setActiveNav("__calculator__");
    if (window.GensightCalculator) {
      window.GensightCalculator.mount(calc);
    }
    window.location.hash = "calculator";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function openDocument(file) {
    const item = manifest.find((doc) => doc.file === file);
    if (!item || !docs[file]) return;
    activeView = "doc";
    activeFile = file;
    document.getElementById("warroom").style.display = "none";
    document.getElementById("calcView").style.display = "none";
    document.getElementById("docView").style.display = "block";
    document.querySelector("#docMeta").textContent = `${item.title} · ${item.description}`;
    document.querySelector("#docBody").innerHTML = marked.parse(docs[file]);
    document.querySelectorAll("[data-doc-link]").forEach((link) =>
      link.addEventListener("click", (event) => {
        event.preventDefault();
        openDocument(link.dataset.docLink);
      })
    );
    setActiveNav(file);
    window.location.hash = file;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  const renderer = new marked.Renderer();
  renderer.link = (href, title, text) => {
    const filename = decodeURIComponent(String(href || ""))
      .replace(/^\.\//, "")
      .split("#")[0]
      .split("/")
      .pop();
    if (docs[filename]) {
      return `<a href="#${filename}" data-doc-link="${filename}"${title ? ` title="${title}"` : ""}>${text}</a>`;
    }
    return `<a href="${href}" target="_blank" rel="noreferrer"${title ? ` title="${title}"` : ""}>${text}</a>`;
  };
  marked.setOptions({ renderer });

  buildNav();
  renderWarroom();

  const hash = decodeURIComponent(window.location.hash.slice(1));
  if (hash === "calculator") showCalculator();
  else if (docs[hash]) openDocument(hash);
  else showWarroom();
})();
</script>
